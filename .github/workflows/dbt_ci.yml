name: dbt CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  dbt_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Write RSA Key File
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > dbt_key.p8

      - name: Create profiles.yml for CI
        run: |
          mkdir -p ~/.dbt
          echo "dbt_demo_project:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: '${{ secrets.SNOWFLAKE_ACCOUNT }}'
                user: 'SVC_DBT'
                role: 'SVC_DBT_DEV_ROLE'
                warehouse: 'DEV_TRANSFORM_WH'
                database: 'DEV_BRONZE'
                schema: 'GED'
                threads: 2
                private_key_passphrase: '${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}'
                private_key_path: 'dbt_key.p8'" > ~/.dbt/profiles.yml

      - name: Test dbt models in DEV
        run: |
          cd dbt_demo_project
          dbt deps
          dbt debug --target dev
          dbt build --target dev